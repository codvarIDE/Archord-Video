[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "venma-video"
version = "0.1.0"
description = "A PyQt5 video editor with the Venma design language, powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt5>=5.15"]

[project.optional-dependencies]
icons = ["qtawesome"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
venma-video = "venma_video.app:main"

[tool.setuptools.packages.find]
include = ["venma_video*"]

[tool.setuptools.package-data]
venma_video = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
# The existing code style uses compact one-liners; relax these until a dedicated cleanup PR.
ignore = ["E701", "E702", "E731", "E741"]
